<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Rgistration</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <header class="topbar">
        <h1>Maths &amp; Data Science Tutoring</h1>
        <nav>
            <a href="index.html">Home</a>
            <a href="login.html">Login</a>
        </nav>
    </header>
    <main class="container narrow">
        <section class="card">
            <h2>Student registration</h2>
            <div id="pageMessage" style="display:none"></div>

            <form id="registerForm" action="../php/register.php" method="post">
                <div class="row">
                    <div>
                        <label for="first_name">First name</label>
                        <input type="text" id="first_name" name="first_name" required minlength="2" maxlength="50" autocomplete="given-name">
                    </div>
                    <div>
                        <label for="last_name">Last name</label>
                        <input type="text" id="last_name" name="last_name" required minlength="2" maxlength="50" autocomplete="family-name">
                    </div>
                </div>

                <label for="email">Email address</label>
                <input type="email" id="email" name="email" required maxlength="100" autocomplete="email">

                <label for="phone">Cell phone number</label>
                <input type="tel" id="phone" name="phone" required pattern="0[0-9]{9}" maxlength="10"
                    placeholder="0821234567" title="10 digits starting with 0" autocomplete="tel">

                <label for="password">Password</label>
                <input type="password" id="password" name="password" required minlength="8" maxlength="72"
                    pattern="(?=.*[a-z])(?=.*[A-Z])(?=.*[0-9]).{8,}"
                    title="At least 8 characters with an uppercase letter, a lowercase letter and a number"
                    autocomplete="new-password">
                <p class="hint">At least 8 characters with an uppercase letter, a lowercase letter and a number.</p>

                <label for="confirm_password">Confirm password</label>
                <input type="password" id="confirm_password" name="confirm_password" required minlength="8" maxlength="72" autocomplete="new-password">

                <button type="submit">Register</button>
            </form>
            <p>Already registered? <a href="login.html">Login here</a>.</p
        </section>
    </main>
    <script src="../js/validation.js"></script>
</body>
</html>
